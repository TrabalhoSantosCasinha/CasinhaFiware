# FIWARE da Casinha: Orion (Context Broker) + IoT Agent UltraLight (MQTT público) + STH-Comet (histórico)
services:
  mongo-db:
    image: mongo:${MONGO_VERSION}
    container_name: casinha-mongo
    command: --nojournal
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  orion:
    image: fiware/orion:${ORION_VERSION}
    container_name: casinha-orion
    depends_on:
      - mongo-db
    command: -dbhost mongo-db -logLevel INFO -corsOrigin __ALL
    ports:
      - "1026:1026"

  iot-agent:
    image: fiware/iotagent-ul:${ULTRALIGHT_VERSION}
    container_name: casinha-iot-agent
    depends_on:
      - mongo-db
      - orion
    ports:
      - "4041:4041"
    environment:
      - IOTA_CB_HOST=orion
      - IOTA_CB_PORT=1026
      - IOTA_CB_NGSI_VERSION=v2
      - IOTA_NORTH_PORT=4041
      - IOTA_REGISTRY_TYPE=mongodb
      - IOTA_MONGO_HOST=mongo-db
      - IOTA_MONGO_PORT=27017
      - IOTA_MONGO_DB=iotagentul
      - IOTA_PROVIDER_URL=http://iot-agent:4041
      - IOTA_MQTT_HOST=${MQTT_HOST}
      - IOTA_MQTT_PORT=${MQTT_PORT}
      - IOTA_DEFAULT_RESOURCE=
      - IOTA_TIMESTAMP=true
      - IOTA_AUTOCAST=true
      - IOTA_AMQP_DISABLED=true
      - IOTA_LOG_LEVEL=INFO

  sth-comet:
    image: fiware/sth-comet:${STH_COMET_VERSION}
    container_name: casinha-sth-comet
    depends_on:
      - mongo-db
    ports:
      - "8666:8666"
    environment:
      - STH_HOST=0.0.0.0
      - STH_PORT=8666
      - DB_PREFIX=sth_
      - DB_URI=mongo-db:27017
      - LOGOPS_LEVEL=INFO

volumes:
  mongo-data:
